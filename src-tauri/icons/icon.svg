<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景毛玻璃 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#eef0f4" stop-opacity="0.90" />
    </linearGradient>

    <!-- 蓝色渐变 -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0088FF" />
      <stop offset="100%" stop-color="#5856D6" />
    </linearGradient>

    <!-- 中心环渐变（外圈到内圈） -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0088FF" stop-opacity="1" />
      <stop offset="40%" stop-color="#4A6DFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#5856D6" stop-opacity="0.9" />
    </linearGradient>

    <!-- 中心环内部高光 -->
    <linearGradient id="ringHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000" flood-opacity="0.12" />
    </filter>

    <filter id="innerGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur" />
      <feOffset dx="0" dy="-2" result="offsetBlur" />
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="in" result="inner" />
      <feFlood flood-color="#ffffff" flood-opacity="0.35" result="color" />
      <feComposite in="color" in2="inner" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 中心环阴影 -->
    <filter id="ringShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- 背景 -->
  <rect x="20" y="20" width="472" height="472" rx="112" 
        fill="url(#bgGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="2"
        filter="url(#shadow)" />
  <rect x="20" y="20" width="472" height="472" rx="112" 
        fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"
        filter="url(#innerGlow)" />

  <!-- ===== 风：两条弧线 ===== -->
  <g fill="none" stroke="url(#blueGrad)" stroke-linecap="round">
    <!-- 上弧：大半径 160 -->
    <path d="M 96 256 A 160 160 0 0 1 416 256" stroke-width="18" />
    
    <!-- 下弧：半径 130 -->
    <path d="M 386 256 A 130 130 0 0 1 126 256" stroke-width="14" />
  </g>

  <!-- ===== 巢：粗中心环 ===== -->
  <!-- 外圈光晕 -->
  <circle cx="256" cy="256" r="52" fill="rgba(0,136,255,0.05)" />

  <!-- 主环（粗体，带渐变） -->
  <circle cx="256" cy="256" r="40" 
          fill="none" 
          stroke="url(#ringGrad)" 
          stroke-width="8" 
          filter="url(#ringShadow)" />

  <!-- 环的内高光（左上角光晕） -->
  <circle cx="256" cy="256" r="40" 
          fill="none" 
          stroke="url(#ringHighlight)" 
          stroke-width="4" />

  <!-- 环的外边框（增强立体感） -->
  <circle cx="256" cy="256" r="44" 
          fill="none" 
          stroke="rgba(255,255,255,0.08)" 
          stroke-width="0.5" />

  <!-- 内圈细环（丰富层次） -->
  <circle cx="256" cy="256" r="32" 
          fill="none" 
          stroke="rgba(0,136,255,0.05)" 
          stroke-width="1" />
</svg>